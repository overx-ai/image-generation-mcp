provider: "replicate"
storage:
  base_path: "../data/generated_images"
  organize_by_date: true
cache:
  enabled: true
  cache_dir: "../data/cache"
  ttl_days: 30
  max_size_mb: 1000
defaults:
  max_retries: 3

# Model Configuration
models:
  # Default model across tools - OpenAI gpt-image-2.5 Flare, called directly with
  # OPENAI_API_KEY (all tools default to quality "medium" ~$0.013/image).
  # Override per call via `model`, e.g. "openai/gpt-image-2.5-sunburst".
  default: "openai/gpt-image-2.5-flare"

  # Tried in order when the primary model fails (e.g. the OpenAI account runs out
  # of credit). gpt-image-2 here runs Replicate-billed; the rest are Replicate-native.
  # "nano-banana" resolves by requested quality: low/medium -> google/nano-banana-2,
  # high/auto -> google/nano-banana-pro.
  fallback:
    - "openai/gpt-image-2"
    - "nano-banana"
    - "bytedance/seedream-3"

  # Budget models - mix of custom aspect ratios via width/height and native
  budget:
    sdxl: "stability-ai/sdxl"
    flux_schnell: "black-forest-labs/flux-schnell"

  # Premium models (native aspect ratio support)
  premium:
    gpt_image_25_flare: "openai/gpt-image-2.5-flare"
    gpt_image_25_sunburst: "openai/gpt-image-2.5-sunburst"
    gpt_image_2: "openai/gpt-image-2"
    nano_banana_2: "google/nano-banana-2"
    nano_banana_pro: "google/nano-banana-pro"
    flux_dev: "black-forest-labs/flux-dev"
    flux_pro: "black-forest-labs/flux-1.1-pro"
    recraft: "recraft-ai/recraft-v3"
    seedream: "bytedance/seedream-3"
    ideogram_turbo: "ideogram-ai/ideogram-v3-turbo"

  # Style mapping - gpt-image-2.5 Flare is the default for all styles
  style_mapping:
    photorealistic: "openai/gpt-image-2.5-flare"
    photorealistic_with_text: "openai/gpt-image-2.5-flare"
    artistic: "openai/gpt-image-2.5-flare"
    cartoon: "openai/gpt-image-2.5-flare"
    sketch: "openai/gpt-image-2.5-flare"

retry:
  max_attempts: 3
  backoff_factor: 2
  initial_delay: 1.0
  max_delay: 60.0

# Image optimization settings for web deployment
optimization:
  enabled: true  # Enable web optimization by default
  max_width: 2048  # Maximum width for web images
  max_height: 2048  # Maximum height for web images
  jpeg_quality: 85  # JPEG quality (1-100)
  webp_quality: 85  # WebP quality (1-100)
  create_webp: true  # Create WebP variants for better compression
  create_responsive: false  # Create responsive image variants (can be enabled later)